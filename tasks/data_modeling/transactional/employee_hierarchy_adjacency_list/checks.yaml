  - name: rejects_self_manager
    type: rejects
    weight: 2
    sql: INSERT INTO employees (employee_id, name, manager_id) VALUES (10, 'Jo', 10)
  - name: rejects_duplicate_id
    type: rejects
    sql: INSERT INTO employees (employee_id, name, manager_id) VALUES (3, 'Kim', 1)
  - name: rejects_missing_name
    type: rejects
    sql: INSERT INTO employees (employee_id, name, manager_id) VALUES (11, NULL, 1)

