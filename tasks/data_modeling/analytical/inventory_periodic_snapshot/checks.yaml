checks:
  - {name: snapshot_columns, type: columns, table: fct_inventory_daily, columns: [snapshot_date, sku, quantity_on_hand, net_change]}

  - name: dense_grid_one_row_per_product_per_day
    type: assert
    weight: 2
    sql: |
      SELECT count(*) = 30 AND count(DISTINCT (snapshot_date, sku)) = 30
         AND min(snapshot_date) = DATE '2024-01-01' AND max(snapshot_date) = DATE '2024-01-10'
      FROM fct_inventory_daily

