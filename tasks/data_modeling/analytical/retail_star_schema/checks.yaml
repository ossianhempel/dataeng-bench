checks:
  - {name: dim_customer_columns, type: columns, table: dim_customer, columns: [customer_key, customer_id, customer_name, country]}
  - {name: dim_product_columns, type: columns, table: dim_product, columns: [product_key, sku, product_name, category]}
  - {name: dim_date_columns, type: columns, table: dim_date, columns: [date_key, full_date, year, quarter, month, month_name, day_of_week_name, is_weekend]}
  - {name: fct_sales_columns, type: columns, table: fct_sales, columns: [order_id, line_number, date_key, customer_key, product_key, quantity, net_amount]}

  - name: customer_unknown_member
    type: rows
    sql: SELECT customer_key, customer_id, customer_name, country FROM dim_customer WHERE customer_key < 0
    expected: [[-1, UNKNOWN, Unknown, Unknown]]
  - name: product_unknown_member
    type: rows
    sql: SELECT product_key, sku, product_name, category FROM dim_product WHERE product_key < 0
    expected: [[-1, UNKNOWN, Unknown, Unknown]]
  - name: surrogate_keys_unique_and_one_row_per_natural_key
    type: assert
    sql: |
      SELECT (SELECT count(*) = 4 AND count(DISTINCT customer_key) = 4 AND count(DISTINCT customer_id) = 4 FROM dim_customer)
         AND (SELECT count(*) = 4 AND count(DISTINCT product_key) = 4 AND count(DISTINCT sku) = 4 FROM dim_product)

  - name: date_dimension_covers_q1_2024
    type: rows
    sql: SELECT count(*), count(DISTINCT date_key), min(full_date)::VARCHAR, max(full_date)::VARCHAR FROM dim_date
    expected: [[91, 91, '2024-01-01', '2024-03-31']]
  - name: date_key_is_yyyymmdd
    type: assert
    sql: SELECT bool_and(date_key = year(full_date) * 10000 + month(full_date) * 100 + day(full_date)) FROM dim_date
  - name: date_attributes
    type: rows
    sql: |
      SELECT date_key, year, quarter, month, month_name, day_of_week_name, is_weekend
      FROM dim_date WHERE date_key IN (20240101, 20240229, 20240331)
    expected:
      - [20240101, 2024, 1, 1, January, Monday, false]
      - [20240229, 2024, 1, 2, February, Thursday, false]
      - [20240331, 2024, 1, 3, March, Sunday, true]
  - name: weekend_day_count
    type: rows
    sql: SELECT count(*) FROM dim_date WHERE is_weekend
    expected: [[26]]

  - name: fact_keeps_every_sale
    type: rows
    weight: 2
    sql: SELECT count(*), sum(net_amount) FROM fct_sales
    expected: [[6, 188.00]]
  - name: fact_foreign_keys_resolve
    type: assert
    weight: 2
    sql: |
      SELECT count(*) = 0 FROM fct_sales f
      LEFT JOIN dim_customer c USING (customer_key)
      LEFT JOIN dim_product p USING (product_key)
      LEFT JOIN dim_date d USING (date_key)
      WHERE c.customer_key IS NULL OR p.product_key IS NULL OR d.date_key IS NULL
  - name: revenue_by_category
    type: rows
    weight: 2
    sql: |
      SELECT p.category, sum(f.net_amount) FROM fct_sales f JOIN dim_product p USING (product_key)
      GROUP BY 1
    expected: [[Kitchen, 90.00], [Home, 90.00], [Unknown, 8.00]]
  - name: revenue_by_country
    type: rows
    weight: 2
    sql: |
      SELECT c.country, sum(f.net_amount) FROM fct_sales f JOIN dim_customer c USING (customer_key)
      GROUP BY 1
    expected: [[SE, 73.00], ['NO', 60.00], [Unknown, 55.00]]
  - name: revenue_by_month
    type: rows
    sql: |
      SELECT d.month_name, sum(f.net_amount) FROM fct_sales f JOIN dim_date d USING (date_key)
      GROUP BY 1
    expected: [[January, 110.00], [February, 60.00], [March, 18.00]]
